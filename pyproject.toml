[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthtwin"
version = "0.1.0.dev0"
description = "Create a synthetic twin of your tabular data: same shape, each column behaving like the same column of yours, built from a description of your table rather than from its rows. No cross-column structure yet. Fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alfredo Camargo Rodrigues" }]
keywords = ["synthetic-data", "privacy", "tabular", "offline"]
# Trove classifiers omitted: the standard license classifier's wording
# collides with the decontamination manifest; the `license` field above
# carries the license declaration.
# FOUR runtime dependencies, each justified in a ratified plan, each
# reduced by the offline scanner to the exact names it may use, and each
# held to the ZONES it may run in (plan P4-D409 part 2: G generation, D
# description and shared report, P private report and tests, R reading,
# W writing; plan P4-D410 enters them). Every pin is exact in the locks
# and every floor is the version the floor Python, 3.11, installs.
#
# numpy: Phase 2 (docs/plans/phase-2-generator.md, P2-D8), zone G,
# reduced to `numpy.random.default_rng` and, on the generator it
# returns, the one `integers` call in the one draw form the method
# specification fixes (P2-D13, E7 and E8). Phase 1 review round 1
# showed its float REDUCTIONS made published statistics depend on row
# order, so no published statistic comes from one (P1-D2, P1-D11);
# P4-D409 admits integer-exact use in zone D, one name at a time.
# 2.4.6 is the last numpy for Python 3.11; 3.12 and later get 2.5.
#
# pyarrow: P4-D409, zone R (a reader handed only a validated local path
# and one thread) and text cells held as exact bytes. Its mere presence
# also switches pandas 3's string storage, which `reading.read_table`
# therefore sets explicitly (P4-D410). Nothing of pyarrow is a float
# computation in G or D.
#
# scipy: P4-D409, zone D on the search side only (HiGHS through
# `scipy.optimize.milp`, its output silenced and its budget in nodes,
# every arrangement it exhibits re-checked in Python integers) and zone
# P (the Cholesky pair for the self-test's fits). Never in G. 1.17.1 is
# the last scipy for Python 3.11; 3.12 and later get 1.18.
#
# pandas: Phase 1 (docs/plans/phase-1-profiler.md, P1-D2), zone R,
# reduced to `read_csv`, which may only be called with a validated local
# path (P1-D10), and to setting its own string storage. It reads the
# real table, is never reachable from the generation path, and leaves
# the product if lane SR-A's pyarrow check replaces it (P4-D409, D-L3).
#
# Each floor is repeated in requirements-dev.in, requirements-min.in and
# requirements-install.in, and tests/test_dependencies.py fails if any of
# them disagree.
dependencies = [
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
    "scipy>=1.17.1",
    "pandas>=3.0.6",
]

# THE OPTIONAL POLISH KERNEL (P4-D409 part 4, owner Q3 of 2026-10-19:
# "Yes, gated"). numba compiles one audited module, the polish kernel,
# and is used only after CI proves it byte-identical to the plain-Python
# polish on every operating system and Python; the plain-Python polish
# is the oracle and the fallback, so a twin is the same bytes with or
# without it. No numba wheel exists for Intel Macs, which the marker
# leaves out: they run the fallback. The floor is repeated in
# requirements-dev.in.
[project.optional-dependencies]
polish = [
    "numba>=0.68.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.urls]
Repository = "https://github.com/alfredocr05/synthtwin"

[project.scripts]
synthtwin = "synthtwin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synthtwin"]

[tool.hatch.build.targets.sdist]
include = [
    "src/synthtwin",
    "tests",
    "tools",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]

# THE RULE SET IS NAMED RATHER THAN INHERITED, and it is named because
# inheriting it broke. This project was written against ruff's classic
# default -- pycodestyle's error subset plus pyflakes -- and later ruff
# versions widened what "default" means. The tree then carried 183
# reports it had never been written to satisfy, 120 of them quoted type
# annotations, which are a deliberate style here: this codebase writes
# `"list[str]"` in annotations throughout. Tracking a tool's changing
# default silently is how a lint job comes to fail on a style nobody
# chose, so the set is written down.
#
# Widening it is a decision somebody makes on purpose, in this file.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# The decontamination and disposition tools put their own directory on
# the path before importing from it, which is the one thing that has to
# happen before those imports and cannot happen after them.
[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E402"]

[tool.mypy]
strict = true
files = ["src"]

# pandas, pyarrow and scipy ship no type information of their own (no
# py.typed marker, measured on the pinned wheels), and the separately
# published stub packages are not dependencies of this project: adding
# them would put third-party packages into the type check that the
# offline audit would then have to reason about. Each library is
# confined by the offline scanner to a few enumerated names, and what
# comes back is converted to plain values where it is used, so the
# untyped surface stops there. numpy and numba ship their own types and
# are checked normally. statsmodels, scikit-learn and openpyxl are
# test-only (P4-D409 zone P) and named here so that a check of the tests
# reads them the same way.
[[tool.mypy.overrides]]
module = [
    "openpyxl",
    "openpyxl.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "statsmodels",
    "statsmodels.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
