          sdist tree ROOT/tests/ .py,.json,.txt,.md,.toml
          sdist tree ROOT/tools/ .py,.json,.txt,.md,.toml,.sh
          ALLOWLIST
          export ALLOWLIST_PATH="$RUNNER_TEMP/artifact-allowlist.txt"
          python3 - <<'SCRIPT'
          import os
          import pathlib
          import sys
          import tarfile
          import zipfile

          rules = {
              "wheel": {"required": set(), "optional": set(), "tree": []},
              "sdist": {"required": set(), "optional": set(), "tree": []},
          }
          allow_path = pathlib.Path(os.environ["ALLOWLIST_PATH"])
          for raw in allow_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split()
              archive, rule, path = parts[0], parts[1], parts[2]
              if rule == "tree":
                  rules[archive]["tree"].append((path, tuple(parts[3].split(","))))
              else:
                  rules[archive][rule].add(path)

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              print("Expected exactly one wheel and one sdist in dist/.")
              print(f"Found wheels: {[p.name for p in wheels]}")
              print(f"Found sdists: {[p.name for p in sdists]}")
              print("Clear dist/ and rerun the build job.")
              sys.exit(1)

          version = wheels[0].name.split("-")[1]

          wheel_names = []
          with zipfile.ZipFile(wheels[0]) as zf:
              for name in zf.namelist():
                  if name.endswith("/"):
                      continue
                  wheel_names.append(
                      name.replace(f"synthtwin-{version}.dist-info/", "DIST-INFO/", 1)
                  )
          sdist_names = []
          root_prefix = f"synthtwin-{version}/"
          with tarfile.open(sdists[0]) as tf:
              for member in tf.getmembers():
                  if not member.isfile():
                      continue
                  name = member.name
                  if name.startswith(root_prefix):
                      name = "ROOT/" + name[len(root_prefix):]
                  sdist_names.append(name)

          def check(archive: str, names: list) -> list:
              ruleset = rules[archive]
              problems = []
              present = set()
              for name in names:
                  allowed = (
                      name in ruleset["required"]
                      or name in ruleset["optional"]
                      or any(
                          name.startswith(prefix) and name.endswith(exts)
                          for prefix, exts in ruleset["tree"]
                      )
                  )
                  if allowed:
                      present.add(name)
                  else:
                      problems.append(f"unexpected file in the {archive}: {name}")
              for req in sorted(ruleset["required"] - present):
                  problems.append(f"missing required file in the {archive}: {req}")
              return problems

          problems = check("wheel", wheel_names) + check("sdist", sdist_names)
          if problems:
              print("Packaging content check failed:")
              for entry in problems:
                  print(" -", entry)
              print("If a listed file is intentional, add it to the allowlist in")
              print(".github/workflows/ci.yml (build job, content-check step).")
              print("Otherwise adjust pyproject.toml so it is not shipped, or")
              print("restore the missing file, then run CI again.")
              sys.exit(1)
          print(f"wheel ok ({len(wheel_names)} files); sdist ok ({len(sdist_names)} files)")
          SCRIPT
