          # installed package's own entry point with the internal
          # `small_tables_refused` keyword off, which no command line reaches.
          set +e
          "$RUNNER_TEMP/fresh-env/bin/synthtwin" profile "$DEMO/table.csv" \
            --identifier record_code
          refused=$?
          set -e
          if [ "$refused" != 1 ] || [ -e "$DEMO/table-profile.json" ]; then
            echo "The installed command did not refuse a table under the table floor (exit $refused)."
            exit 1
          fi
          "$RUNNER_TEMP/fresh-env/bin/python" -c 'import sys; from synthtwin import cli; sys.exit(cli.main(sys.argv[1:], small_tables_refused=False))' \
            profile "$DEMO/table.csv" --identifier record_code
          "$RUNNER_TEMP/fresh-env/bin/python" - <<'CHECK'
          import json
          import os
          import pathlib
          import sys

          from synthtwin import contract

          demo = pathlib.Path(os.environ["RUNNER_TEMP"]) / "demo"
          document = json.loads(
              (demo / "table-profile.json").read_text(encoding="utf-8")
          )
          summary = (demo / "table-profile.txt").read_text(encoding="utf-8")
          problems = []
          if document["n_rows"] != 240 or document["n_columns"] != 13:
              problems.append(f"unexpected shape: {document['n_rows']}x{document['n_columns']}")
          roles = {column["name"]: column["role"] for column in document["columns"]}
          expected = {
              "record_code": "identifier",
              "region": "categorical",
              "recorded_on": "datetime",
              "answer": "binary",
              "comment": "free_text",
              "unused": "empty",
              "batch": "constant",
              # The three roles Phase 4 added to this fixture. They
              # were in the table and NOT in this map, so the one
              # end-to-end check that runs the real command exercised
              # ten roles and asserted nothing about the four the phase
              # was for.
              "dose": "affixed_number",
              "seen_at": "time_of_day",
              "note": "long_tail_labels",
          }
          for name, role in expected.items():
              if roles.get(name) != role:
                  problems.append(f"{name} was read as {roles.get(name)}, expected {role}")
          # WHAT THE DEFAULT FLOOR WITHHOLDS IS READ FROM THE PACKAGE AND
          # THE TABLE, never written here. This step asserted a floor of
          # eleven, then of one (plan amendment A-P4-37), and each time
          # went on asserting the old rule after the default moved --
          # the second time through the whole of stage 3, which put the
          # default back to eleven (plan P4-D316), because ci.yml runs on
          # no developer machine. tests/test_ci_demo_steps.py runs these
          # steps in the suite now, so the next move is red at home.
          import csv

          from synthtwin import parsing

          floor = parsing.DEFAULT_SMALL_CELL_FLOOR
          with (demo / "table.csv").open(encoding="utf-8", newline="") as handle:
              held = {}
              for row in csv.DictReader(handle):
                  label = row["region"].strip()
                  if label:
                      held[label] = held.get(label, 0) + 1
          rare = {label: rows for label, rows in held.items() if rows < floor}
          region = [c for c in document["columns"] if c["name"] == "region"][0]
          if region["suppressed_levels"] != len(rare):
              problems.append(
                  f"{region['suppressed_levels']} label(s) withheld at the default "
                  f"floor of {floor}, where the table holds {len(rare)} below it"
              )
          if region["suppressed_rows"] != sum(rare.values()):
              problems.append(
                  f"{region['suppressed_rows']} row(s) pooled at the default floor "
                  f"of {floor}, where {sum(rare.values())} stand below it"
              )
          published = {level["label"] for level in region["levels"]}
          for label, rows in sorted(held.items()):
              if (label in published) == (label in rare):
                  state = "published" if label in published else "withheld"
                  problems.append(
                      f"{label!r}, on {rows} row(s), is {state} at the default floor of {floor}"
                  )
          # The declared identifier column publishes the SHAPE of its
          # repetition and never a value (review item P1-R8-F4, owner
          # decision 2026-08-10). Check both halves on a clean machine:
          # the field is there, and it is a mapping of counts to counts.
          codes = [c for c in document["columns"] if c["name"] == "record_code"][0]
          shape = codes.get("n_distinct_by_occurrences")
          if not isinstance(shape, dict) or not shape:
              problems.append("the identifier column published no repetition shape")
          else:
              if sum(shape.values()) != codes["n_distinct"]:
                  problems.append("the repetition shape does not sum to n_distinct")
              if sum(int(k) * v for k, v in shape.items()) != codes["n_present"]:
                  problems.append("the repetition shape does not sum to n_present")
          # The version the shipped loader accepts, read from the
          # package rather than written here. This check ran for five
          # days asserting 4 while the product wrote 5, and the whole
          # branch was red on it -- a number copied into CI is a number
          # nobody updates, and the v5 sweep reached the code, the
          # tests, the specifications and the independent oracle but
          # not this file.
          if document.get("profile_version") != contract.PROFILE_VERSION:
              problems.append(
                  f"unexpected contract version: {document.get('profile_version')}"
              )
          # The three axes are what a consumer dispatches on
          # (plan P2-D3), so they are checked on a clean machine on
          # EVERY column rather than on the ones this block already
          # names: an axis that is present on nine columns and absent on
          # the tenth is worse than no axis at all.
          for column in document["columns"]:
              for axis in ("statistical_type", "quality_state", "structural_role"):
                  if not isinstance(column.get(axis), str) or not column[axis]:
                      problems.append(f"{column['name']} carries no {axis}")
          if codes.get("structural_role") != "identifier":
              problems.append("the declared column is not marked as a key column")
          if codes.get("statistical_type") != "code":
              problems.append("the declared column does not hold codes")
          # And the reserved cross-column block: eight names, every one
          # empty, because this version preserves no structure between
          # columns and says so (plan P2-D5).
          related = document.get("relationships")
          slots = [
              "deterministic",
              "grain",
              "hierarchy",
              "keys",
              "missing_data_process",
              "statistical",
              "temporal",
              "validation_targets",
          ]
          if not isinstance(related, dict) or sorted(related) != slots:
              problems.append(f"unexpected relationship manifest: {related}")
          elif any(value is not None for value in related.values()):
              problems.append("the relationship manifest claims structure it has none of")
          # A label below the default floor reaches NEITHER output file,
          # and one at or above it is named in the description.
          for text in (json.dumps(document), summary):
              for label in sorted(rare):
                  if label in text:
                      problems.append(
                          f"{label!r}, below the default floor of {floor}, "
                          "reached an output file"
                      )
              if "R00007" in text:
                  problems.append("an identifier value reached an output file")
          if problems:
              print("The end-to-end profiling check failed:")
              for entry in problems:
                  print(" -", entry)
              sys.exit(1)
          print("profiled the demonstration table; roles and suppression are as expected")
          CHECK
          # THE SECOND HALF OF THE WORKFLOW, in the same installed wheel,
          # the same fresh venv and under the same socket guard. Until
          # this was written the built-artifact smoke test ran `profile`
          # and never `generate`, so a generation path that worked on a
          # source checkout and was broken only in a packaged wheel --
          # a module left out of the wheel allowlist, a lazily imported
          # name that resolves from the repository and not from
          # site-packages -- would have shipped with CI green. The input
          # is the description the run above wrote, so nothing is
          # committed for this and no table is read a second time: the
          # generator is handed the description and nothing else.
          "$RUNNER_TEMP/fresh-env/bin/synthtwin" generate \
            "$DEMO/table-profile.json" --seed 7
          "$RUNNER_TEMP/fresh-env/bin/python" - <<'TWIN'
          import csv
          import json
          import os
          import pathlib
          import sys

          demo = pathlib.Path(os.environ["RUNNER_TEMP"]) / "demo"
          twin_path = demo / "table-twin.csv"
          report_path = demo / "table-twin-report.txt"
          problems = []
          for target in (twin_path, report_path):
              if not target.is_file():
                  problems.append(f"{target.name} was not written")
          if problems:
              print("The end-to-end generation check failed:")
              for entry in problems:
                  print(" -", entry)
              print("A run of 'synthtwin generate' must leave exactly two files")
              print("beside the description: the twin and its report.")
              sys.exit(1)
          document = json.loads(
              (demo / "table-profile.json").read_text(encoding="utf-8")
          )
          names = [column["name"] for column in document["columns"]]
          # The twin is UTF-8 with no byte-order mark of its own, whatever
          # the table was written as, so a reader gets the published
          # column names back rather than a first name with the mark's
          # bytes stuck to it.
          if twin_path.read_bytes().startswith(b"\xef\xbb\xbf"):
              problems.append("the twin begins with a byte-order mark")
          with twin_path.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.reader(handle))
          body = []
          if not rows:
              problems.append("the twin holds no rows at all")
          else:
              if rows[0] != names:
                  problems.append(f"the twin's header is {rows[0]}, expected {names}")
              body = rows[1:]
              # 240 by 13 is this fixture's shape, checked against the
              # description AND written out, so a description that came
              # out the wrong shape cannot make the twin look right by
              # agreeing with it.
              if len(body) != document["n_rows"] or len(body) != 240:
                  problems.append(f"the twin has {len(body)} row(s), expected 240")
              widths = sorted({len(row) for row in body})
              if widths != [document["n_columns"]] or widths != [13]:
                  problems.append(f"the twin's rows hold {widths} cell(s), expected [10]")
          report = report_path.read_text(encoding="utf-8")
          if "Seed: 7." not in report:
              problems.append("the report does not name the seed the twin was built at")
          if problems:
              print("The end-to-end generation check failed:")
              for entry in problems:
                  print(" -", entry)
              sys.exit(1)
          print(
              f"generated the twin from the description alone: {len(body)} rows "
              f"by {len(names)} columns, with its report beside it"
          )
          TWIN
      - name: Egress mutation - a fetch under --network none must fail
        # Plan D5 / D6.5: the deliberate HTTP fetch attempted under the
        # same image and the same --network none isolation must fail.
        run: |
          set +e
          docker run --rm --network none "$BUILD_IMAGE" \
            python -c "import urllib.request; urllib.request.urlopen('http://example.com/', timeout=5)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "The egress attempt under --network none SUCCEEDED."
            echo "The build container must have no network path at all"
            echo "(plan D5). Do not merge until isolation is restored."
            exit 1
          fi
          echo "egress attempt failed as required (exit $status): no network available"

  decontam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the commit-message step below reads every
          # commit past the grandfather line, and refuses a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run the decontamination scanner
        # Plan D7 / D9: the checker scans all tracked files and paths
        # against the hashed manifest. Attestation-signature checking
        # and the neutral mutation battery are NOT inside the checker:
        # they run as the two separate steps below, so removing either
        # step removes that control (review R2-m3).
        run: |
          if [ ! -f tools/decontamination/check.py ]; then
            echo "The decontamination checker is missing:"
            echo "  tools/decontamination/check.py"
            echo "Every push must run it (plans D7 and D9). Restore the file"
            echo "from version control before merging."
            exit 1
          fi
          python tools/decontamination/check.py
      - name: Verify the signed attestation
        # Review item F13: the decontam job itself must verify the
        # attestation chain and run the full self-test battery, not just
        # the tree scan.
        run: python tools/decontamination/verify_attestation.py
      - name: Scan the commit messages past the grandfather line
        # Principle 4 names commit messages (plan P4-D362). A pull
        # request's own commits are read -- what its head reaches and its
        # base does not -- and on a push every commit of the branch; the
        # scanner leaves out what the grandfather commit reaches, whose
        # messages were published before this guard, and FAILS on a
        # shallow clone or a history without the grandfather instead of
        # passing either. tests/test_ci_demo_steps.py runs this block.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'MESSAGES'
          import os
          import sys

          sys.path.insert(0, "tools/hooks")
          import check_messages

          revisions = []
          if os.environ.get("EVENT_NAME") == "pull_request":
              revisions = [os.environ["HEAD_SHA"], "^" + os.environ["BASE_SHA"]]
          sys.exit(check_messages.main(revisions))
          MESSAGES
      - name: Validate the requirement files before pip runs (text only)
        # Review R2-B3: a non-executing structural check of
        # requirements-dev.in and requirements-dev.lock, run before any
        # pip command reads the lock. Any direct file, archive, path,
        # VCS, editable, or URL reference is refused while it is still
        # text, so pip never gets a chance to fetch or build it.
        run: |
          python tools/supply_chain/validate_lock.py
          python tools/supply_chain/validate_lock.py \
            --lock requirements-install.lock \
            --input requirements-install.in
      - name: Install locked dev tools for the battery (frozen)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK_FILE"
      - name: Run the decontamination self-test battery
        run: python -m pytest tests/test_decontamination.py -q

  offline-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate the requirement files before pip runs (text only)
        # Review R2-B3: a non-executing structural check of
        # requirements-dev.in and requirements-dev.lock, run before any
        # pip command reads the lock. Any direct file, archive, path,
        # VCS, editable, or URL reference is refused while it is still
        # text, so pip never gets a chance to fetch or build it.
        run: |
          python tools/supply_chain/validate_lock.py
          python tools/supply_chain/validate_lock.py \
            --lock requirements-install.lock \
            --input requirements-install.in
      - name: Install locked dev tools (frozen)
        run: |
          if [ ! -f "$LOCK_FILE" ]; then
            echo "The lock file $LOCK_FILE is missing from the repository root."
            echo "It pins every development and build tool by version and hash"
            echo "(plan D5). Restore it from version control, or ask a"
            echo "maintainer to rebuild and commit it, then run CI again."
            exit 1
          fi
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK_FILE"
      - name: Run the import-allowlist scanner over src/
        # Plan D6.2: the positive, API-granular allowlist scan. This job
        # never installs the project: the scanner reads source files, and
        # tests/test_offline_scan.py loads the scanner from its file path
        # without importing the synthtwin package, so no project build
        # hook runs on this networked runner.
        run: |
          if [ ! -f tools/offline_scan/scan_imports.py ]; then
            echo "The offline import scanner is missing:"
            echo "  tools/offline_scan/scan_imports.py"
            echo "Every push must run it (plans D6 and D9). Restore the file"
            echo "from version control before merging."
            exit 1
          fi
          python tools/offline_scan/scan_imports.py src/
      - name: Run the offline-scan test suite (mutation classes)
        run: python -m pytest tests/test_offline_scan.py

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate the requirement files before pip runs (text only)
        # Review R2-B3: a non-executing structural check of
        # requirements-dev.in and requirements-dev.lock, run before any
        # pip command reads the lock. Any direct file, archive, path,
        # VCS, editable, or URL reference is refused while it is still
        # text, so pip never gets a chance to fetch or build it.
        run: |
          python tools/supply_chain/validate_lock.py
          python tools/supply_chain/validate_lock.py \
            --lock requirements-install.lock \
            --input requirements-install.in
      - name: Install locked dev tools (frozen)
        run: |
          if [ ! -f "$LOCK_FILE" ]; then
            echo "The lock file $LOCK_FILE is missing from the repository root."
            echo "It pins every development and build tool by version and hash"
            echo "(plan D5). Restore it from version control, or ask a"
            echo "maintainer to rebuild and commit it, then run CI again."
            exit 1
          fi
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK_FILE"
      - name: Run the data-provenance guard
        # Plan D13: re-runs the generator for every committed fixture and
        # byte-compares it; refuses tracked data-format files that are not
        # on the fixture manifest. This job never installs the project:
        # the checker and tests/test_provenance.py work on files and
        # subprocesses without importing the synthtwin package, so no
        # project build hook runs on this networked runner.
        run: |
          if [ ! -f tools/provenance/check_provenance.py ]; then
            echo "The provenance checker is missing:"
            echo "  tools/provenance/check_provenance.py"
            echo "Every push must run it (plans D13 and D9). Restore the file"
            echo "from version control before merging."
            exit 1
          fi
          python tools/provenance/check_provenance.py
      - name: Run the provenance test suite (mutation classes)
        run: python -m pytest tests/test_provenance.py

  sensitive-paths:
    # Plan D14: surface every pull-request change to the CI workflow
    # definitions or the checker tooling as a prominent warning
    # annotation plus a step-summary section; the prompted human review
    # is the control. Detection results never fail this job, but its
    # own machinery must work: when the diff against the base commit
    # cannot be produced, the job goes red instead of silently
    # reporting nothing (review R2-B10). On a push there is no base to
    # compare, so the report is produced on pull requests only. The
    # job keeps the default read-only token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the pull request's base commit is present to
          # diff against.
          fetch-depth: 0
      - name: Surface changes under .github/workflows/ or tools/
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "This run is not a pull request, so there is no base to"
            echo "compare against. The sensitive-path report is produced"
            echo "on pull requests only."
            exit 0
          fi
          set +e
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- .github/workflows tools)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Sensitive-path comparison failed::The diff against the base commit failed (git diff exit $status), so changes under .github/workflows/ or tools/ could not be listed. This job fails so a broken comparison cannot pass silently. Fix the checkout depth or the base reference, rerun CI, and review the changed files by hand in the meantime."
            {
              echo "## Sensitive paths"
              echo ""
              echo "The comparison against the base commit failed, so the"
              echo "changed files could not be listed. This job stays red"
              echo "until the comparison works; review the changed files by"
              echo "hand in the meantime."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "No changes under .github/workflows/ or tools/ in this pull request."
            {
              echo "## Sensitive paths"
              echo ""
              echo "No changes under \`.github/workflows/\` or \`tools/\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LISTED="$(echo "$CHANGED" | tr '\n' ' ')"
          echo "::warning title=Security-sensitive paths changed::This pull request changes files that define the checks themselves: $LISTED- review them with extra care and list them in the next release notes (plan D14)."
          {
            echo "## Sensitive paths changed"
            echo ""
            echo "This pull request touches files that define the checks"
            echo "themselves. Review them with extra care and list them in the"
            echo "next release notes (plan D14):"
            echo ""
            echo "$CHANGED" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  minimums:
    needs: build
    # Plan D5: an untested floor is a guess. This job installs EXACTLY
    # the versions pyproject.toml declares as lower bounds, on the
    # oldest supported interpreter (3.11, plan P4-D410), and runs the
    # whole suite against them. requirements-min.in holds those pins and
    # tests/test_dependencies.py fails if they ever disagree with the
    # declared floors.
    #
    # IT REPRODUCES THE REFERENCE VECTORS AT THE FLOORS. The suite holds
    # the committed reference vectors and goldens
    # (tests/test_generation_reference.py, tests/test_numeric_reference.py,
    # tests/test_twin_golden.py), so the shard that takes them proves the
    # twin's bytes under the floor numpy, 2.4.6: the one place where a
    # change of numpy's random stream between versions would show (plan
    # P4-D409 part 2). The test-only libraries are not installed here;
    # the tests that use them skip and say so.
    #
    # SHARDED TOO (landing D), and this is the cell that needed it most:
    # the floors job runs the whole suite on the oldest interpreter in
    # one process, and twice came near three hours. It takes the same
    # disjoint file lists every other cell takes.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate the requirement files before pip runs (text only)
        run: |
          python tools/supply_chain/validate_lock.py
          python tools/supply_chain/validate_lock.py \
            --lock requirements-min.lock \
            --input requirements-min.in
      - name: Install the declared floors (frozen, hash-checked)
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-min.lock
      - name: Download the wheel built inside the no-network container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthtwin-wheel
          path: dist
      - name: Install that wheel without touching the pinned floors
        # The wheel comes from the build job's --network none container,
        # so no project build hook ever runs on a networked runner
        # (review item P1-R1-F11: this job used to build from source
        # here, outside the ratified build boundary, with a backend the
        # floor lock does not even contain). --no-deps keeps the floors
        # installed above exactly as they are.
        run: python -m pip install --no-index --no-deps dist/*.whl
      - name: Prove the floors are the versions actually installed
        # Review item P1-R2-F8: showing a freeze listing is not a check.
        # This compares what is installed against what pyproject.toml
        # declares, and fails BEFORE the suite runs, so a lock
        # regenerated at newer versions cannot pass as a floor test.
        run: |
          python -m pip freeze
          python - <<'SCRIPT'
          import importlib.metadata
          import pathlib
          import sys

          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          start = text.index("dependencies = [")
          block = text[start : text.index("]", start)]
          problems = []
          for piece in block.split('"')[1::2]:
              name, _, floor = piece.partition(">=")
              name, floor = name.strip(), floor.strip()
              installed = importlib.metadata.version(name)
              print(f"{name}: declared floor {floor}, installed {installed}")
              if installed != floor:
                  problems.append(
                      f"{name} declares a floor of {floor} but {installed} "
                      "is installed, so this job is not testing the floor"
                  )
          if problems:
              for entry in problems:
                  print(" -", entry)
              print("Rebuild requirements-min.in/.lock at the declared floors.")
              sys.exit(1)
          print("every declared floor is the version installed")
          SCRIPT
      - name: Run this shard of the suite against the declared floors
        run: |
          python tools/ci/shards.py --of "$SHARD_COUNT" --shard "${{ matrix.shard }}" \
            > shard-files.txt
          if [ ! -s shard-files.txt ]; then
            echo "shard ${{ matrix.shard }} of $SHARD_COUNT holds no test file."
            echo "An empty list would hand pytest no arguments, and pytest with no"
            echo "arguments runs the WHOLE suite -- so an empty shard must stop here"
            echo "rather than quietly cost five times what it should."
            exit 1
          fi
          echo "shard ${{ matrix.shard }} of $SHARD_COUNT: $(wc -l < shard-files.txt) test files"
          python -m pytest $(cat shard-files.txt)

  bundle-build:
    # THE OFFLINE BUNDLE, THE ONLY WAY SYNTHTWIN IS INSTALLED (plan
    # P4-D416, lane DEP-2; the owner's D3 of 2026-10-20; plan P4-D409
    # part 7). One bundle per platform, built on that platform's own
    # runner: `pip download` evaluates the lock's markers for the
    # machine it runs on, so a cross-download would drop Windows' tzdata.
    # Every Python the tests matrix proves (3.11 to 3.14, plan P4-D410)
    # downloads its wheels of requirements-install.lock with every hash
    # checked and binary wheels only; tools/bundle/build_bundle.py then
    # refuses any file that is not a wheel the lock pins by its SHA-256,
    # adds the synthtwin wheel the build job made in its no-network
    # container, the install scripts and their check, INSTALL.txt,
    # THIRD-PARTY-NOTICES.txt gathered from the wheels' own metadata
    # (never committed: the decontamination scanner matches lines of the
    # libraries' licence texts, and wheels are binary files) and
    # SHA256SUMS over every file. The zip, synthtwin-<version>-<platform>.zip
    # as README names it, goes to bundle-test as this run's artifact and
    # nowhere else: nothing is published. On macOS the wheels are the
    # ones macOS 12 takes (pip download --platform macosx_12_0_arm64),
    # not the macOS 14 wheels pip would pick for the runner itself, so
    # the bundle serves every Mac with an Apple chip on macOS 12 or later
    # and bundle-test proves those wheels' bytes (lane DEP-2's skeptic,
    # item 3); a wheel needing a newer macOS stops the job.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x86_64
          - os: windows-latest
            platform: win_amd64
          - os: macos-latest
            platform: macos_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py314
        with:
          python-version: "3.14"
      - name: Validate the requirement files before pip runs (text only)
        run: |
          python tools/supply_chain/validate_lock.py \
            --lock requirements-install.lock \
            --input requirements-install.in
      - name: Download the wheel built inside the no-network container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthtwin-wheel
          path: dist
      - name: Download every Python's wheels, hash-checked, wheels only
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          for PY in "$PY311" "$PY312" "$PY313" "$PY314"; do
            if [ "$RUNNER_OS" = "macOS" ]; then
              VERSION="$("$PY" -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
              "$PY" -m pip download --require-hashes --only-binary=:all: \
                --platform macosx_12_0_arm64 --implementation cp \
                --python-version "$VERSION" --abi "cp${VERSION/./}" \
                --dest "$RUNNER_TEMP/wheelhouse" -r requirements-install.lock
            else
              "$PY" -m pip download --require-hashes --only-binary=:all: \
                --dest "$RUNNER_TEMP/wheelhouse" -r requirements-install.lock
            fi
          done
          if ls "$RUNNER_TEMP/wheelhouse" | grep -E 'macosx_(1[3-9]|[2-9][0-9])_'; then
            echo "A wheel above needs a macOS newer than 12; the bundle serves macOS 12 and later."
            exit 1
          fi
      - name: Assemble the bundle (every file hashed, notices gathered)
        run: |
          python tools/bundle/build_bundle.py \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --synthtwin-wheel dist/synthtwin-*.whl \
            --platform "${{ matrix.platform }}" \
            --out "$RUNNER_TEMP/bundle" \
            --zip-into "$RUNNER_TEMP/zipped"
      - name: Check the bundle with every Python it serves
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          BUNDLE="$(python -c "import os, pathlib; print(next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'bundle').glob('synthtwin-*')))")"
          for PY in "$PY311" "$PY312" "$PY313" "$PY314"; do
            "$PY" -I "$BUNDLE/scripts/check_bundle.py" "$BUNDLE"
          done
          du -sh "$BUNDLE"
      - name: Hand the bundle to bundle-test (this run's artifact only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthtwin-bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/zipped/synthtwin-*-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 5

  bundle-test:
    # THE BUNDLE INSTALLED AS A PERSON INSTALLS IT, THE NETWORK DENIED
    # (plan P4-D416). On a clean runner of each platform, under each
    # Python 3.11 to 3.14: unzip the bundle into a folder whose name
    # holds a space, deny the network, run the install script with no
    # argument (it checks SHA256SUMS, then pip installs with --isolated
    # --no-index --require-hashes, then runs `synthtwin doctor`), then
    # profile, generate and validate an invented table and run the
    # golden tests -- the twin's bytes against the committed reference
    # vectors -- on the installed synthtwin. On Linux the network is
    # denied by the kernel (a network namespace with no interface but
    # its own loopback); on macOS and Windows by pip's own --no-index and
    # --isolated with every proxy pointed at a closed port, and the step
    # proves each denial before it installs. pytest itself, which the
    # bundle does not carry, is fetched hash-checked from the
    # development lock BEFORE the network is denied, into a folder of
    # its own; the bundle's environment stays the bundle's.
    needs: bundle-build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        system:
          - os: ubuntu-latest
            platform: linux_x86_64
          - os: windows-latest
            platform: win_amd64
          - os: macos-latest
            platform: macos_arm64
    runs-on: ${{ matrix.system.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download this platform's bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthtwin-bundle-${{ matrix.system.platform }}
          path: ${{ runner.temp }}/zipped
      - name: Fetch pytest for the golden tests, hash-checked, outside the bundle
        run: |
          python tools/supply_chain/validate_lock.py
          python - <<'SCRIPT'
          import pathlib
          import re

          wanted = {"pytest", "iniconfig", "packaging", "pluggy", "pygments", "colorama"}
          text = pathlib.Path("requirements-dev.lock").read_text(encoding="utf-8")
          kept = [
              block
              for block in re.findall(r"^[a-z0-9_.-]+==(?:[^\n]*\\\n)*[^\n]*", text, re.M)
              if block.split("==", 1)[0] in wanted
          ]
          assert {block.split("==", 1)[0] for block in kept} == wanted, kept
          pathlib.Path("pytest-only.txt").write_text("\n".join(kept) + "\n", encoding="utf-8")
          SCRIPT
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            --target "$RUNNER_TEMP/pytest-only" -r pytest-only.txt
      - name: Unzip the bundle into a folder whose name holds a space
        run: |
          python - <<'SCRIPT'
          import os
          import pathlib
          import zipfile

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          (archive,) = sorted((temp / "zipped").glob("*.zip"))
          with zipfile.ZipFile(archive) as opened:
              opened.extractall(temp / "clean bundle")
          SCRIPT
      - name: Deny the network, prove it denied, install, run doctor
        env:
          PYTHON_CELL: ${{ matrix.python-version }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            offline() { sudo unshare --net -- sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" \
              "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$@"; }
          else
            offline() { env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
              ALL_PROXY=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 \
              https_proxy=http://127.0.0.1:9 NO_PROXY= no_proxy= "$@"; }
          fi
          offline python -I -c "
          import sys, urllib.request
          try:
              urllib.request.urlopen('https://pypi.org/simple/', timeout=20)
          except OSError as error:
              print('the network is denied here:', type(error).__name__)
          else:
              sys.exit('pypi.org was reached: the network is NOT denied')
          "
          BUNDLE="$(python -c "import os, pathlib; print(next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'clean bundle').glob('synthtwin-*')))")"
          cd "$BUNDLE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export MSYS_NO_PATHCONV=1
            offline cmd.exe /d /c "scripts\\install.bat" 2>&1 | tee install.log
            status=${PIPESTATUS[0]}
            test -f .venv/Scripts/synthtwin.exe
          else
            offline sh scripts/install.sh 2>&1 | tee install.log
            status=${PIPESTATUS[0]}
            test -x .venv/bin/synthtwin
          fi
          test "$status" -eq 0
          if grep -E "Downloading|Looking in indexes|Looking in links: http|Retrying|Could not fetch URL|ProxyError|NewConnectionError|Failed to establish|pypi.org|files.pythonhosted.org" install.log; then
            echo "pip reached for the network during the install; the bundle must be enough."
            exit 1
          fi
          python -I - "$PYTHON_CELL" <<'SCRIPT'
          import pathlib
          import re
          import sys

          said = pathlib.Path("install.log").read_text(encoding="utf-8", errors="replace")
          used = re.findall(r"^using .* (\d+\.\d+)\.\d+", said, re.M)
          print("the install used Python", used, "in the cell of", sys.argv[1])
          if used != [sys.argv[1]]:
              sys.exit("The script installed with another Python than this cell's.")
          SCRIPT
      - name: A bundle with one changed byte is refused before anything is made
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            offline() { sudo unshare --net -- sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" \
              "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$@"; }
          else
            offline() { env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 "$@"; }
          fi
          BUNDLE="$(python -c "import os, pathlib; print(next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'clean bundle').glob('synthtwin-*')))")"
          CHANGED="$RUNNER_TEMP/changed bundle/$(basename "$BUNDLE")"
          python - "$BUNDLE" "$CHANGED" <<'SCRIPT'
          import pathlib
          import shutil
          import sys

          source, target = (pathlib.Path(name) for name in sys.argv[1:])
          shutil.copytree(source, target, ignore=shutil.ignore_patterns(".venv", "install.log"))
          wheel = sorted(
              path for path in (target / "wheelhouse").glob("*.whl")
              if not path.name.startswith("synthtwin-")
          )[0]
          data = bytearray(wheel.read_bytes())
          data[len(data) // 2] ^= 1
          wheel.write_bytes(bytes(data))
          print("changed one byte of", wheel.name)
          SCRIPT
          cd "$CHANGED"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export MSYS_NO_PATHCONV=1
            if offline cmd.exe /d /c "scripts\\install.bat" > refused.log 2>&1; then
              cat refused.log
              echo "install.bat installed a bundle with a changed file."
              exit 1
            fi
          else
            if offline sh scripts/install.sh > refused.log 2>&1; then
              cat refused.log
              echo "install.sh installed a bundle with a changed file."
              exit 1
            fi
          fi
          cat refused.log
          grep -q "does not match its hash in SHA256SUMS" refused.log
          test ! -e .venv
      - name: Profile, generate and validate an invented table, network denied
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            offline() { sudo unshare --net -- sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" \
              "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$@"; }
          else
            offline() { env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 "$@"; }
          fi
          BUNDLE="$(python -c "import os, pathlib; print(next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'clean bundle').glob('synthtwin-*')))")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ST="$BUNDLE/.venv/Scripts/synthtwin.exe"
          else
            ST="$BUNDLE/.venv/bin/synthtwin"
          fi
          WORK="$RUNNER_TEMP/invented table"
          mkdir -p "$WORK"
          python tools/bundle/invented_table.py "$WORK/table.csv"
          offline "$ST" profile "$WORK/table.csv"
          offline "$ST" generate "$WORK/table-profile.json" --seed 7
          offline "$ST" validate "$WORK/table-profile.json" --twin "$WORK/table-twin.csv"
      - name: Run the golden tests on the installed synthtwin, network denied
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            offline() { sudo unshare --net -- sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" \
              "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$@"; }
          else
            offline() { env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 "$@"; }
          fi
          BUNDLE="$(python -c "import os, pathlib; print(next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'clean bundle').glob('synthtwin-*')))")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BPY="$BUNDLE/.venv/Scripts/python.exe"
          else
            BPY="$BUNDLE/.venv/bin/python"
          fi
          "$BPY" -c "import synthtwin, sys; print(synthtwin.__file__); sys.exit(0 if '.venv' in synthtwin.__file__ else 1)"
          offline env "PYTHONPATH=$RUNNER_TEMP/pytest-only" "$BPY" -m pytest -p no:cacheprovider \
            tests/test_twin_golden.py tests/test_generation_reference.py \
            tests/test_numeric_reference.py

  numba-vectors:
    # THE NUMBA VECTOR JOB (plan P4-D409 part 4, the owner's "Yes,
    # gated" of 2026-10-19; plan P4-D416). A whole multi-pass schedule
    # of the polish runs compiled by numba AND as plain Python on every
    # system and Python of the matrix, and one differing byte fails the
    # gate: lane MPn's kernel is not adopted while any does, and the
    # plain-Python polish stays the oracle and the fallback. Until MPn
    # writes synthtwin.polish_kernel the job runs the stand-in schedule
    # of tests/test_numba_vectors.py and its bound cases; once the kernel
    # exists, the file refuses to pass without the kernel's own cases.
    # numba comes from the development lock (no Intel-Mac wheel, so no
    # Intel runner here); SYNTHTWIN_REQUIRE_NUMBA makes its absence a
    # failure rather than a skip.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate the requirement files before pip runs (text only)
        run: |
          python tools/supply_chain/validate_lock.py
      - name: Install locked dev tools (frozen)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK_FILE"
      - name: Download the wheel built inside the no-network container
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synthtwin-wheel
          path: dist
      - name: Install the wheel (no index, no deps, no build hooks)
        run: python -m pip install --no-index --no-deps dist/*.whl
      - name: Run the polish schedule under numba and under plain Python
        env:
          SYNTHTWIN_REQUIRE_NUMBA: "1"
        run: python -m pytest -p no:cacheprovider tests/test_numba_vectors.py

  gate:
    # Plan D9 / D14: the single aggregate status context, the required
    # context under the branch ruleset applied at Phase 3's visibility
    # flip (see SECURITY.md's activation record). Runs always, and
    # goes green only when every job above succeeded (a skipped or
    # cancelled job is a failure here, not a pass).
    needs:
      [
        lint,
        types,
        tests,
        shard-coverage,
        build,
        decontam,
        offline-static,
        provenance,
        sensitive-paths,
        minimums,
        bundle-build,
        bundle-test,
        numba-vectors,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require success from every job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'SCRIPT'
          import json
          import os
          import sys

          required = [
              "lint",
              "types",
              "tests",
              # The proof that the sharded `tests` and `minimums` jobs
              # between them ran every collected file, exactly once
              # (landing D). Without it a green `tests` matrix could be
              # a matrix that ran four fifths of the suite.
              "shard-coverage",
              "build",
              "decontam",
              "offline-static",
              "provenance",
              "sensitive-paths",
              "minimums",
              # The offline bundle, built on each platform and installed
              # with the network denied (plan P4-D416), and the numba
              # vector job lane MPn's kernel is adopted on (P4-D409 part 4).
              "bundle-build",
              "bundle-test",
              "numba-vectors",
          ]
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = []
          for job in required:
              result = needs.get(job, {}).get("result", "missing")
              print(f"{job}: {result}")
              if result != "success":
                  bad.append(f"{job} finished with result '{result}'")
          if bad:
              print()
              print("The gate stays red because not every required job succeeded:")
              for entry in bad:
                  print(" -", entry)
              print("Open the failed job's log for its specific fix-it message.")
              sys.exit(1)
          print("All required jobs succeeded. The gate is green.")
          SCRIPT
