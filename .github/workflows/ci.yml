          import socket


          def _refuse(*_args, **_kwargs):
              raise RuntimeError(
                  "Network use is refused in this offline smoke test. synthtwin "
                  "must work with no network at all; if you see this message, a "
                  "network attempt happened and that is a bug worth reporting."
